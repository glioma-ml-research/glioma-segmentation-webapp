# Runs as an unprivileged user (nginx-unprivileged image), so it listens on 8080.
limit_req_zone $binary_remote_addr zone=signin:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

# Keep the scheme an outer TLS proxy reported; otherwise ours.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # Up to five files of MAX_UPLOAD_MB (512 MB) each; the backend enforces the exact limits.
    client_max_body_size 2600m;
    client_body_timeout 300s;

    location /api/ {
        limit_req zone=api burst=200 nodelay;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        # Overwritten, not appended: a client cannot pick the address the rate limits see.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /api/auth/login {
        limit_req zone=signin burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Hashed file names: cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        try_files $uri =404;
    }

    # Single-page app: unknown paths fall back to index.html.
    location / {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }

    # Request lines contain only random job ids, never file names or tokens
    # (invite tokens travel in the URL fragment, which browsers never send).
    access_log /var/log/nginx/access.log;
}
